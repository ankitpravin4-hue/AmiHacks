[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-scanner"
version = "0.6.0"
description = "SentinelAPI scanner core, service, and CI gate"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12",
  "httpx>=0.27.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  "pyyaml>=6.0",
  "sqlmodel>=0.0.22",
  "python-dotenv>=1.0.1",
  "google-generativeai>=0.8.0",
]

[project.scripts]
sentinel = "sentinel_cli.main:app"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[tool.setuptools.packages.find]
where = ["."]
include = ["sentinel_core*", "sentinel_cli*", "sentinel_service*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
