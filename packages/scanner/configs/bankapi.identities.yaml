# Ground-truth identities for the local BankAPI target.
# `owns` is what each identity is *allowed* to access — the BOLA detector
# uses this to distinguish a real leak from a legitimate read.
identities:
  - name: alice
    is_admin: false
    headers:
      Authorization: Bearer tok_bank_alice
    owns:
      user: [1]
      account: [101]
      transaction: [1001, 1002]

  - name: bob
    is_admin: false
    headers:
      Authorization: Bearer tok_bank_bob
    owns:
      user: [2]
      account: [201]
      transaction: [2001, 2002]

  - name: admin
    is_admin: true
    headers:
      Authorization: Bearer tok_bank_admin
    owns:
      user: [3]
      account: [301]

  - name: anonymous
    is_admin: false
    headers: {}
    owns: {}
